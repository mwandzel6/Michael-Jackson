  <body>
    <header>
      <div class="tytuł_układ">

      <label class="pytanie" for="mail">Podaj adres e-mail:</label>
      <input type="email" required id="mail" />
      <label class="pytanie" for="alb">
        Jaki jest twój ulubiony album Michaela Jacksona?
      </label>
      <select required id="alb">
        <option value="" disabled selected hidden>--</option>
        <option>Got to Be There</option>
        <option>Ben</option>
        <option>Music & Me</option>
        <option>Forever, Michael</option>
        <option>Off The Wall</option>
        <option>Thriller</option>
        <option>Bad</option>
        <option>Dangerous</option>
        <option>HIStory</option>
        <option>Blood on the Dance Floor</option>
        <option>Invincible</option>
        <option>Michael</option>
        <option>Xscape</option>
      </select>
      <label class="pytanie" for="oth"
        >Podziel się opinią, uwagą, historią:</label
      >
      <textarea id="oth"></textarea>
      <button type="submit">Wyślij</button>
    </form>
    <footer>
      <div><p>Mateusz Wandzel</p></div>
